<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>にっぽん都道府県マスター</title>
<style>
:root{--blue:#0068b7;--ink:#1a1a1c;--muted:#5f6368;--bg:#f5f7f9;--line:#c9d0d6;--focus:#ffbf00;--good:#087f5b;--bad:#c92a2a;--gold:#f59f00;--radius:12px;--shadow:0 4px 18px rgba(0,0,0,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.6}
button{font:inherit}button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}.header{background:#fff;border-bottom:4px solid var(--blue);padding:14px 18px;position:sticky;top:0;z-index:10}.header-inner,.app{max-width:1200px;margin:auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;font-size:1.35rem}.brand span{color:var(--blue)}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#eef5fb;border:1px solid #b8d5ec;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.9rem}.app{padding:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tab{border:2px solid var(--blue);background:#fff;color:var(--blue);padding:13px;border-radius:10px;font-weight:900;cursor:pointer}.tab.active{background:var(--blue);color:#fff;box-shadow:0 5px 0 #004b87}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.section-title{font-size:1.15rem;font-weight:900;margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #9fb1bf;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:800}.chip.active{background:#e6f2fb;border-color:var(--blue);color:var(--blue)}
.main-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr);gap:16px}.map-wrap{min-height:500px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#f9fcff,#edf5fb);border-radius:12px}.geo-map-host{width:100%;display:flex;justify-content:center;align-items:center}.geo-map-host .geolonia-svg-map{width:100%;height:auto;max-height:650px}.geo-map-host .prefecture{fill:#fff;stroke:#66737d;stroke-width:1.2;cursor:pointer;transition:.18s}.geo-map-host .prefecture:hover{fill:#dceeff}.geo-map-host .prefecture.target{fill:#ffe066!important;stroke:#f08c00!important;stroke-width:3!important;filter:drop-shadow(0 0 10px rgba(245,159,0,.75))}.geo-map-host .prefecture.correct{fill:#8ce99a!important;stroke:#087f5b!important;stroke-width:3!important}.geo-map-host .prefecture.wrong{fill:#ffa8a8!important;stroke:#c92a2a!important;stroke-width:3!important}
.hero{text-align:center}.number{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:999px;min-width:48px;height:48px;font-size:1.2rem;font-weight:900}.big{font-size:clamp(1.7rem,4vw,2.8rem);font-weight:950;margin:8px 0}.sub{color:var(--muted)}.fact{background:#fff9db;border-left:6px solid var(--gold);padding:12px;border-radius:8px;margin-top:12px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}.primary,.secondary{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff;box-shadow:0 4px 0 #004b87}.secondary{background:#fff;border:2px solid #69747c;color:#263238}.progress{height:12px;background:#e3e8ec;border-radius:99px;overflow:hidden;margin:10px 0}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#51cf66,#ffd43b,#ff922b);transition:width .35s}.quiz-title{text-align:center}.question-map{max-width:700px;margin:auto}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.answer{min-height:72px;border:3px solid #b5bec5;background:#fff;border-radius:12px;cursor:pointer;font-size:1.15rem;font-weight:900;transition:.15s;position:relative}.answer:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:var(--shadow)}.answer .key{position:absolute;left:10px;top:7px;background:#eef2f5;border-radius:7px;padding:1px 7px;font-size:.75rem}.answer.correct{background:#d3f9d8;border-color:var(--good);color:#075e44}.answer.wrong{background:#ffe3e3;border-color:var(--bad);color:#8d1515}.feedback{text-align:center;font-size:1.8rem;font-weight:950;min-height:46px;margin:12px 0}.feedback.good{color:var(--good);animation:bounce .5s}.feedback.bad{color:var(--bad);animation:shake .4s}@keyframes bounce{50%{transform:scale(1.18)}}@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}.mode-panel{display:none}.mode-panel.active{display:block}.review-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.review{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.small{font-size:.85rem;color:var(--muted)}footer{text-align:center;color:#66717a;font-size:.8rem;padding:20px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.confetti i{position:absolute;width:10px;height:16px;animation:fall 1.1s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:800px){.main-grid{grid-template-columns:1fr}.map-wrap{min-height:360px}.answers{grid-template-columns:1fr}.header-inner{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header class="header"><div class="header-inner"><div class="brand">🗾 <span>にっぽん都道府県マスター</span></div><div class="stats"><div class="stat">⭐ 学習 <span id="learnedCount">0</span>/47</div><div class="stat">🎯 正解率 <span id="accuracy">0%</span></div><div class="stat">🔥 <span id="streak">0</span>連続</div></div></div></header>
<main class="app">
<div class="tabs"><button class="tab active" data-mode="learn">📚 覚えるモード</button><button class="tab" data-mode="quiz">🎤 答えるモード</button></div>
<section id="learn" class="mode-panel active"><div class="card"><h2 class="section-title">どこから覚える？</h2><div id="regionChips" class="chips"></div></div><div class="main-grid"><div class="card map-wrap"><div id="japanMap" class="geo-map-host" aria-label="日本地図"></div></div><div class="card"><div class="hero"><div class="number" id="learnNumber">01</div><div class="big" id="learnName">北海道</div><div class="sub" id="learnPlace">北海道</div></div><div class="fact" id="learnFact"></div><div class="progress"><i id="learnProgress" style="width:2%"></i></div><div class="sub" style="text-align:center" id="learnStep">1 / 47</div><div class="actions"><button class="secondary" id="prevBtn">← まえ</button><button class="primary" id="nextBtn">つぎ →</button></div><div class="actions"><button class="secondary" id="resetLearn">この地方を最初から</button></div></div></div></section>
<section id="quiz" class="mode-panel"><div class="card"><div class="chips" id="quizControls"></div></div><div class="card"><div class="quiz-title"><div class="sub" id="quizProgress">第1問</div><div class="big">この県はどこ？</div><div class="sub">地図の黄色い県を選んでね！</div></div><div class="question-map map-wrap"><div id="quizMap" class="geo-map-host" aria-label="日本地図"></div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="answers" id="answers"></div><div class="actions"><button class="primary" id="nextQuestion" style="display:none">つぎの問題 →</button></div></div></section>
<section class="card"><h2 class="section-title">📊 学習記録</h2><div id="recordSummary" class="review-list"></div><div class="actions"><button class="secondary" id="clearData">学習記録をリセット</button></div></section></main>
<footer>地図：Geolonia japanese-prefectures（Wikipedia「日本地図.svg」ベース／GFDL）。デジタル庁デザインシステムβ版の考え方を参考にした学習アプリです。</footer><div class="confetti" id="confetti"></div>
<script>
const PREF_NAMES=["北海道","青森","岩手","宮城","秋田","山形","福島","茨城","栃木","群馬","埼玉","千葉","東京","神奈川","新潟","富山","石川","福井","山梨","長野","岐阜","静岡","愛知","三重","滋賀","京都","大阪","兵庫","奈良","和歌山","鳥取","島根","岡山","広島","山口","徳島","香川","愛媛","高知","福岡","佐賀","長崎","熊本","大分","宮崎","鹿児島","沖縄"],PREFS=PREF_NAMES.map((name,i)=>({name,code:i+1}));
const regions={"全国":Array.from({length:47},(_,i)=>i+1),"北海道":[1],"東北":[2,3,4,5,6,7],"関東":[8,9,10,11,12,13,14],"中部":[15,16,17,18,19,20,21,22,23],"近畿":[24,25,26,27,28,29,30],"中国":[31,32,33,34,35],"四国":[36,37,38,39],"九州・沖縄":[40,41,42,43,44,45,46,47]};
const facts={1:"日本でいちばん北にある都道府県。道庁所在地は札幌市。",2:"本州でいちばん北にある県。県庁所在地は青森市。",3:"北海道のすぐ南にある県。県庁所在地は盛岡市。",4:"東北地方の太平洋側にある県。県庁所在地は仙台市。",5:"日本海側にある東北地方の県。県庁所在地は秋田市。",6:"山形県のとなりには日本海があるよ。県庁所在地は山形市。",7:"東北地方のいちばん南にある県。県庁所在地は福島市。",8:"関東地方の太平洋側にある県。県庁所在地は水戸市。",9:"関東地方の北部にある県。県庁所在地は宇都宮市。",10:"群馬県は内陸県。県庁所在地は前橋市。",11:"東京の北にある県。県庁所在地はさいたま市。",12:"関東地方の東側にある県。県庁所在地は千葉市。",13:"日本の首都がある都。東京都庁があるよ。",14:"東京の南にある県。県庁所在地は横浜市。",15:"日本海側に細長く広がる県。県庁所在地は新潟市。",16:"立山黒部アルペンルートでも知られる県。県庁所在地は富山市。",17:"能登半島がある県。県庁所在地は金沢市。",18:"日本海側にある県。県庁所在地は福井市。",19:"富士山の北西側にある県。県庁所在地は甲府市。",20:"日本アルプスがある内陸県。県庁所在地は長野市。",21:"日本のほぼ中央にある内陸県。県庁所在地は岐阜市。",22:"富士山の南側に広がる県。県庁所在地は静岡市。",23:"中部地方の太平洋側にある県。県庁所在地は名古屋市。",24:"近畿地方の東側にある県。県庁所在地は津市。",25:"日本最大の湖、琵琶湖がある県。県庁所在地は大津市。",26:"京都市がある府。歴史的な建物が多い地域だよ。",27:"大阪市がある府。近畿地方の中心のひとつだよ。",28:"日本海から瀬戸内海まで広がる県。県庁所在地は神戸市。",29:"紀伊半島の内陸側にある県。県庁所在地は奈良市。",30:"紀伊半島の南側にある県。県庁所在地は和歌山市。",31:"中国地方の日本海側にある県。県庁所在地は鳥取市。",32:"中国地方の日本海側で東西に長い県。県庁所在地は松江市。",33:"中国地方の東側にある県。県庁所在地は岡山市。",34:"中国地方の瀬戸内海側にある県。県庁所在地は広島市。",35:"本州のいちばん西にある県。県庁所在地は山口市。",36:"四国の東側にある県。県庁所在地は徳島市。",37:"四国の北東側にある県。県庁所在地は高松市。",38:"四国の北西側にある県。県庁所在地は松山市。",39:"四国の南側にある県。県庁所在地は高知市。",40:"九州の北側にある県。県庁所在地は福岡市。",41:"九州の北西部にある県。県庁所在地は佐賀市。",42:"九州の西側にある県。県庁所在地は長崎市。",43:"九州の中央部にある県。県庁所在地は熊本市。",44:"九州の東側にある県。県庁所在地は大分市。",45:"九州の東側で南北に長い県。県庁所在地は宮崎市。",46:"九州の南側にある県。県庁所在地は鹿児島市。",47:"日本のいちばん南西にある県。県庁所在地は那覇市。"};
const regionOf=c=>Object.entries(regions).find(([k,v])=>k!=="全国"&&v.includes(c))?.[0]||"",getPref=c=>PREFS.find(p=>p.code===c);
let learnRegion="全国",learnIndex=0,quizMode="number",quizRegion="全国",quizIndex=0,quizTarget=null,quizAnswered=false;
const state=JSON.parse(localStorage.getItem("jpMaster")||'{"seen":[],"correct":0,"total":0,"streak":0,"best":0}');
function save(){localStorage.setItem("jpMaster",JSON.stringify(state));updateStats();renderRecords()}function updateStats(){learnedCount.textContent=state.seen.length;accuracy.textContent=(state.total?Math.round(state.correct/state.total*100):0)+"%";streak.textContent=state.streak}
function mapPaint(id,target,klass="target"){const host=document.getElementById(id);if(!host)return;host.querySelectorAll(".prefecture").forEach(e=>e.classList.remove("target","correct","wrong"));if(target){const el=host.querySelector(".prefecture[data-code='"+target+"']");if(el)el.classList.add(klass)}}
function renderRegions(){regionChips.innerHTML=Object.keys(regions).map(r=>'<button class="chip '+(r===learnRegion?"active":"")+'" data-r="'+r+'">'+r+"</button>").join("");regionChips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{learnRegion=b.dataset.r;learnIndex=0;renderRegions();renderLearn()})}
function renderLearn(){const list=regions[learnRegion],code=list[learnIndex],p=getPref(code);learnNumber.textContent=String(code).padStart(2,"0");learnName.textContent=p.name;learnPlace.textContent=regionOf(code);learnFact.textContent=facts[code];learnStep.textContent=(learnIndex+1)+" / "+list.length;learnProgress.style.width=((learnIndex+1)/list.length*100)+"%";mapPaint("japanMap",code)}
function setupQuizControls(){quizControls.innerHTML='<button class="chip '+(quizMode==="number"?"active":"")+'" id="qNumber">🔢 ナンバリング順</button><button class="chip '+(quizMode==="random"?"active":"")+'" id="qRandom">🎲 ランダム</button>'+Object.keys(regions).map(r=>'<button class="chip '+(r===quizRegion?"active":"")+'" data-qr="'+r+'">'+r+"</button>").join("");qNumber.onclick=()=>{quizMode="number";quizIndex=0;setupQuizControls();newQuestion()};qRandom.onclick=()=>{quizMode="random";quizIndex=0;setupQuizControls();newQuestion()};quizControls.querySelectorAll("[data-qr]").forEach(b=>b.onclick=()=>{quizRegion=b.dataset.qr;quizIndex=0;setupQuizControls();newQuestion()})}
function nearestChoices(target,list){const idx=list.indexOf(target),out=[];for(let d=1;out.length<3&&d<list.length;d++){for(const i of [idx-d,idx+d])if(i>=0&&i<list.length&&i!==idx&&!out.includes(list[i]))out.push(list[i])}return out.slice(0,3)}
function newQuestion(){const list=regions[quizRegion];quizTarget=quizMode==="number"?list[quizIndex%list.length]:list[Math.floor(Math.random()*list.length)];quizAnswered=false;feedback.textContent="";feedback.className="feedback";nextQuestion.style.display="none";quizProgress.textContent=quizMode==="number"?"第"+(quizIndex+1)+"問 / "+list.length+"問":"第"+(state.total+1)+"問";mapPaint("quizMap",quizTarget);const choices=[quizTarget,...nearestChoices(quizTarget,list)].sort(()=>Math.random()-.5);answers.innerHTML=choices.map((c,i)=>'<button class="answer" data-code="'+c+'"><span class="key">'+String.fromCharCode(65+i)+"</span>"+getPref(c).name+'<br><span class="small">'+String(c).padStart(2,"0")+"番</span></button>").join("");answers.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(Number(b.dataset.code),b))}
function answer(code,btn){if(quizAnswered)return;quizAnswered=true;state.total++;if(code===quizTarget){state.correct++;state.streak++;state.best=Math.max(state.best,state.streak);if(!state.seen.includes(quizTarget))state.seen.push(quizTarget);btn.classList.add("correct");feedback.textContent="🎉 せいかい！";feedback.className="feedback good";confetti()}else{state.streak=0;btn.classList.add("wrong");answers.querySelector('.answer[data-code="'+quizTarget+'"]')?.classList.add("correct");feedback.textContent="おしい！ 正解は "+getPref(quizTarget).name;feedback.className="feedback bad"}save();nextQuestion.style.display="inline-block"}
function renderRecords(){const seen=new Set(state.seen);recordSummary.innerHTML=PREFS.map(p=>'<div class="review"><strong>'+(seen.has(p.code)?"✅":"⬜")+" "+String(p.code).padStart(2,"0")+" "+p.name+"</strong><span class="small">'+regionOf(p.code)+"</span></div>").join("")}
function confetti(){confetti.innerHTML="";for(let i=0;i<45;i++){const x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.top="-20px";x.style.background=["#ff6b6b","#ffd43b","#51cf66","#339af0","#845ef7"][i%5];x.style.animationDelay=Math.random()*.35+"s";confetti.appendChild(x)}setTimeout(()=>confetti.innerHTML="",1500)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.querySelectorAll(".mode-panel").forEach(x=>x.classList.remove("active"));document.getElementById(t.dataset.mode).classList.add("active");if(t.dataset.mode==="quiz"){setupQuizControls();newQuestion()}});prevBtn.onclick=()=>{const l=regions[learnRegion];learnIndex=(learnIndex-1+l.length)%l.length;renderLearn()};nextBtn.onclick=()=>{const l=regions[learnRegion];learnIndex=(learnIndex+1)%l.length;renderLearn()};resetLearn.onclick=()=>{learnIndex=0;renderLearn()};nextQuestion.onclick=()=>{quizIndex++;newQuestion()};clearData.onclick=()=>{if(confirm("学習記録を全部リセットしますか？")){localStorage.removeItem("jpMaster");location.reload()}};
const GEO_MAP_URL="./map-full.svg";
async function loadJapanMaps(){try{const res=await fetch(GEO_MAP_URL,{cache:"force-cache"});if(!res.ok)throw new Error();const svg=await res.text();["japanMap","quizMap"].forEach(id=>{const host=document.getElementById(id);host.innerHTML=svg;host.querySelectorAll(".prefecture").forEach(p=>{p.setAttribute("tabindex","0");p.setAttribute("role","button")})});renderLearn();if(quiz.classList.contains("active"))newQuestion()}catch(e){["japanMap","quizMap"].forEach(id=>document.getElementById(id).innerHTML='<div style="padding:30px;text-align:center;color:#c92a2a;font-weight:800">地図を読み込めませんでした。インターネット接続を確認してください。</div>')}}
renderRegions();renderRecords();updateStats();loadJapanMaps();
</script></body></html>
