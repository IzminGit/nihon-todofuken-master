:root{
  --blue:#1f7ae0;--blue-dark:#1558aa;--blue-soft:#e3f0ff;
  --orange:#ff8a1f;--orange-dark:#d0680a;--orange-soft:#fff1e2;
  --ink:#17324d;--text:#2c3e50;--muted:#62768a;--line:#e1eaf2;
  --good:#1fae6a;--good-soft:#e2f8ec;--bad:#e8546b;--bad-soft:#fff0f2;
  --target:#ffd84d;--target-line:#e67700;
  --card-shadow:0 6px 0 #d6e5f2,0 16px 32px rgba(31,90,150,.08);
  --accent:var(--blue);--accent-dark:var(--blue-dark);--accent-soft:var(--blue-soft);
  --font:"MaruJP","Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;
}
body.mode-quiz{--accent:var(--orange);--accent-dark:var(--orange-dark);--accent-soft:var(--orange-soft)}
[data-region="all"]{--c:#1f7ae0;--soft:#dcebfd}
[data-region="hokkaido"]{--c:#3d9be9;--soft:#d5eafb}
[data-region="tohoku"]{--c:#22b08c;--soft:#cff0e5}
[data-region="kanto"]{--c:#f58a2e;--soft:#ffe3cb}
[data-region="chubu"]{--c:#8d6cf0;--soft:#e6ddfd}
[data-region="kinki"]{--c:#e85d9f;--soft:#fcdcec}
[data-region="chugoku"]{--c:#5bb33c;--soft:#dcf1d2}
[data-region="shikoku"]{--c:#1aa9c2;--soft:#cdeff5}
[data-region="kyushu"]{--c:#e5584a;--soft:#fcdbd6}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-weight:700;color:var(--text);line-height:1.6;
  background:radial-gradient(#cfe5f8 1.4px,transparent 1.6px) 0 0/22px 22px,linear-gradient(180deg,#e8f4ff 0%,#f5faff 60%,#fdfcf7 100%);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #ffbf00;outline-offset:3px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ヘッダー ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #dbe8f4}
.topbar-inner{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(140deg,#4aa6f5,#1f6fd6);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #1553a6;flex:none}
.brand-title{font-weight:800;font-size:1.35rem;color:var(--ink);letter-spacing:.03em;line-height:1.2}
.brand-sub{font-size:.8rem;color:var(--muted)}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-size:.95rem;white-space:nowrap}
.stat b{font-size:1.15rem;color:var(--ink)}
.mode-pill{display:none;align-items:center;gap:6px;border:0;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;cursor:pointer}
.mode-pill i{font-style:normal;width:10px;height:10px;border-radius:50%;background:var(--c)}
.sound-btn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 0 #d3e2ef,0 0 0 2px #e1ebf4 inset;cursor:pointer;font-size:1.3rem;display:grid;place-items:center;flex:none;touch-action:manipulation}
.sound-btn[aria-pressed="false"]{opacity:.6}
.menu-btn{display:none;width:44px;height:44px;margin-left:auto;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 0 #d3e2ef,0 0 0 2px #e1ebf4 inset;cursor:pointer;place-items:center;flex:none}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:20px;height:3px;border-radius:3px;background:var(--ink);position:relative;content:""}
.menu-btn span::before{position:absolute;top:-7px}.menu-btn span::after{position:absolute;top:7px}

/* ---------- 共通 ---------- */
.app{max-width:1180px;margin:auto;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:var(--card-shadow);padding:18px}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tab{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;border-radius:20px;border:0;background:#fff;color:#6b7d8f;cursor:pointer;box-shadow:0 5px 0 #d6e3ef;transition:transform .08s,box-shadow .08s}
.tab .ico{font-size:1.8rem}
.tab .t{font-size:1.2rem;font-weight:800;display:block;line-height:1.3}
.tab .s{font-size:.78rem;display:block;opacity:.85}
.tab[data-mode="learn"].active{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-dark)}
.tab[data-mode="quiz"].active{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-dark)}
.tab:active{transform:translateY(3px);box-shadow:0 2px 0 #d6e3ef}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:18px;padding:14px 18px}
.ctrl-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctrl-label{font-weight:800;color:var(--ink);margin-right:4px}
body.mode-learn .order-group{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--soft,#e5edf4);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--text);transition:transform .08s}
.chip::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c,#9aa9b8)}
.chip.plain::before{display:none}
.chip.plain{--soft:#e5edf4}
.chip:hover{transform:translateY(-1px)}
.chip.active{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.chip.plain.active{background:var(--accent);border-color:var(--accent)}
.chip.active::before{background:#fff}
.btn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:1.15rem;cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-dark)}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--text);box-shadow:0 5px 0 #d8e3ed,0 0 0 3px #e1eaf2 inset}
.btn-ghost:active{transform:translateY(4px);box-shadow:0 1px 0 #d8e3ed,0 0 0 3px #e1eaf2 inset}
.btn-good{background:var(--good);color:#fff;box-shadow:0 5px 0 #13824e}
.btn-danger{background:var(--bad);color:#fff;box-shadow:0 5px 0 #b83349}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn-small{padding:8px 14px;font-size:.9rem;border-radius:14px}
.link-btn{border:0;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* ---------- 地図 ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr);gap:20px;align-items:stretch}
.map-card{position:relative;padding:12px;display:flex}
.map-wrap{position:relative;flex:1;height:min(66vh,640px);min-height:420px;border-radius:18px;overflow:hidden;
  background:radial-gradient(circle at 75% 15%,#e4f4ff 0,transparent 45%),radial-gradient(#b8dcf7 1.2px,transparent 1.4px) 0 0/16px 16px,linear-gradient(160deg,#cfe9fd,#b4dafa)}
.geo-map-host{width:100%;height:100%}
.geo-map-host svg{width:100%;height:100%;display:block}
.geo-map-host .prefecture{fill:#fff;stroke:#8ea5ba;stroke-width:1px;transition:fill .3s}
.geo-map-host .prefecture polygon,.geo-map-host .prefecture path{vector-effect:non-scaling-stroke}
.geo-map-host .boundary-line{stroke:#fff;opacity:.7}
.geo-map-host .boundary-line line{vector-effect:non-scaling-stroke;stroke-width:3px;stroke-dasharray:8 6}
#japanMap .prefecture{fill:var(--soft);cursor:pointer}
#japanMap.focus .prefecture{fill:#f3f6f9;stroke:#c3d0dc}
#japanMap.focus .prefecture.in-region{fill:var(--soft);stroke:#8ea5ba}
#japanMap .prefecture:hover{fill:var(--c);fill-opacity:.55}
#japanMap .prefecture:focus{outline:none}
#japanMap .prefecture:focus-visible{stroke:#1f7ae0;stroke-width:3px}
.geo-map-host .prefecture.target{fill:var(--target)!important;fill-opacity:1!important;stroke:var(--target-line)!important;stroke-width:2.5px!important;animation:glow 1.6s ease-in-out infinite}
.geo-map-host .prefecture.correct{fill:#6fdc9f!important;stroke:#0f8f52!important;stroke-width:2.5px!important;animation:none}
.geo-map-host .prefecture.wrong{fill:#ffb3c0!important;stroke:#d9485f!important;stroke-width:2px!important}
@keyframes glow{50%{fill:#ffe98f}}
.pref-labels{pointer-events:none;font-family:var(--font);font-weight:800;fill:#28405a;stroke:rgba(255,255,255,.92);stroke-linejoin:round;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.pref-labels text{stroke-width:.16em}
.pref-labels .rb{font-size:40%;fill:#1f6fcf;stroke-width:.3em;letter-spacing:.02em}
.pref-labels .lbl.hide{display:none}
.pref-labels .lbl.out text{fill:#8a9bab}
.pref-labels .lbl.now .nm{fill:#8a4b00}
.target-ring circle{fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.target-ring .ring{stroke:#ff9f1c;stroke-width:3px}
.target-ring .halo{stroke:#ffb347;stroke-width:3px;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
.target-ring.correct .ring,.target-ring.correct .halo{stroke:#1fae6a}
.target-ring.hidden{display:none}
@keyframes halo{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
.geo-map-host svg{touch-action:none;cursor:grab}
.geo-map-host.dragging svg,.geo-map-host.dragging .prefecture{cursor:grabbing}
.zoom-ctrl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom-btn{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.92);color:var(--blue-dark);font:inherit;font-size:1.35rem;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 3px 0 #c9dbec;display:grid;place-items:center;touch-action:manipulation}
.zoom-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9dbec}
.zoom-btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.map-tip{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 12px;font-size:.8rem;color:var(--muted);pointer-events:none}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);padding:10px 26px;border-radius:22px;font-size:2.4rem;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;box-shadow:0 6px 0 rgba(0,0,0,.12);opacity:0}
.stamp.good{background:var(--good)}
.stamp.bad{background:#ff8a65}
.stamp.show{animation:stamp 1.5s ease forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(2.2)}14%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(.92)}22%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-6deg) scale(1)}}

/* ---------- 覚えるモード ---------- */
.info{display:flex;flex-direction:column;gap:14px}
.info-top{display:flex;justify-content:space-between;align-items:center}
.region-pill{background:var(--c);color:#fff;border-radius:999px;padding:3px 14px;font-weight:800;font-size:.9rem}
.step{color:var(--muted);font-weight:800}
.pref-hero{text-align:center;padding:4px 0 0}
.num-badge{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.55rem;font-weight:800;box-shadow:0 4px 0 var(--blue-dark);font-variant-numeric:tabular-nums}
.pref-text{min-width:0}
.pref-sub{font-size:.95rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pref-name{font-size:clamp(2.5rem,4.6vw,3.7rem);font-weight:800;line-height:1.15;margin-top:10px;color:var(--ink);letter-spacing:.05em}
.pref-ruby{font-size:1.3rem;font-weight:800;color:var(--blue);letter-spacing:.14em}
.speak{margin-top:8px}
.speak-ico{font-size:1.1em}
.fact{background:#fff8e1;border-radius:18px;padding:12px 16px;font-size:1rem;line-height:1.7}
.fact-label{display:block;font-size:.8rem;color:#b77900;font-weight:800}
.progress{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:14px}
.dot{width:13px;height:13px;border-radius:50%;background:#e2e9f0}
.dot.done{background:var(--c)}
.dot.now{background:var(--target);box-shadow:0 0 0 3px #ffeaa0}
.bar{width:100%;height:10px;background:#e7eef5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4aa6f5,var(--blue));transition:width .35s}
.nav{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:auto}
.nav .btn{padding:16px 10px;font-size:1.2rem}
.info-foot{text-align:center;margin-top:-4px}

/* ---------- 答えるモード ---------- */
.qcard{display:flex;flex-direction:column;gap:14px}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-count{background:var(--orange-soft);color:var(--orange-dark);border-radius:999px;padding:3px 14px;font-weight:800}
.streak{background:#fff;border:2px solid #ffd7b0;color:#e0600b;border-radius:999px;padding:2px 12px;font-weight:800;white-space:nowrap}
.streak.zero{border-color:var(--line);color:var(--muted)}
.streak.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.q-title{text-align:center}
.q-title h2{margin:0;font-size:2rem;color:var(--ink);line-height:1.3}
.q-hint{color:var(--muted);font-size:.95rem}
.q-hint i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--target);border:2px solid var(--target-line);vertical-align:-1px;margin-right:4px}
.qbar{width:100%;height:8px;background:#f1ebe4;border-radius:99px;overflow:hidden}
.qbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--orange));border-radius:99px;transition:width .35s}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88px;padding:12px 8px 10px;background:#fff;border:0;border-radius:18px;box-shadow:0 5px 0 #e0e8f0,0 0 0 3px #e3eaf1 inset;font-size:1.3rem;font-weight:800;color:var(--ink);cursor:pointer;line-height:1.25;transition:transform .08s,box-shadow .08s,background .2s;touch-action:manipulation}
.answer .ruby{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:2px}
.answer .key{position:absolute;left:9px;top:8px;width:22px;height:22px;border-radius:7px;background:var(--orange-soft);color:var(--orange-dark);font-size:.78rem;display:grid;place-items:center}
.answer:hover:not(:disabled){box-shadow:0 5px 0 #ffd2a6,0 0 0 3px var(--orange) inset}
.answer:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #e0e8f0,0 0 0 3px var(--orange) inset}
.answer:disabled{cursor:default}
.answer.correct{background:var(--good-soft);box-shadow:0 5px 0 #7fd7a9,0 0 0 3px var(--good) inset;opacity:1}
.answer.correct::after{content:"⭕";position:absolute;right:10px;top:6px;font-size:1rem}
.answer.wrong{background:var(--bad-soft);box-shadow:0 5px 0 #ffc1cb,0 0 0 3px #ff9aab inset}
.answer.wrong::after{content:"✕";position:absolute;right:12px;top:6px;color:var(--bad);font-size:1rem}
.answer.dim{opacity:.5}
.feedback-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.feedback{font-weight:800;font-size:1.1rem;line-height:1.4}
.feedback.good{color:var(--good)}
.feedback.bad{color:#d6455c}
.feedback small{display:block;font-size:.85rem;color:var(--muted)}
#nextQuestion{flex:none}
#nextQuestion[hidden]{display:none}

/* ---------- きろく ---------- */
.records{margin-top:22px}
.records-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.records-head h2{margin:0;font-size:1.3rem;color:var(--ink)}
.records-close{display:none}
.rec-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tile{background:#f5f9fd;border-radius:18px;padding:10px 12px;text-align:center}
.tile .v{font-size:1.6rem;font-weight:800;color:var(--ink);line-height:1.2}
.tile .l{font-size:.8rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:5px;vertical-align:-2px}
.legend .l0::before{background:#eef2f6}
.legend .l1::before{background:#fff;box-shadow:0 0 0 2px #1f7ae0 inset}
.legend .l2::before{background:#1f7ae0}
.rgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px}
.rgroup{border-left:6px solid var(--c);padding:4px 0 4px 12px}
.rgroup h3{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px;color:var(--ink)}
.rgroup h3 .cnt{font-size:.8rem;color:var(--muted)}
.rgroup h3 .medal{font-size:.8rem;background:#fff4c2;color:#a86b00;border-radius:999px;padding:0 8px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:0;border-radius:12px;padding:4px 10px;background:#eef2f6;color:#8797a7;font-weight:800;font-size:.9rem;cursor:pointer}
.pchip.viewed{background:#fff;color:var(--text);box-shadow:0 0 0 2px var(--c) inset}
.pchip.mastered{background:var(--c);color:#fff}
.rec-foot{text-align:right;margin-top:10px}

/* ---------- メニュー(ドロワー) ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer-bg{position:absolute;inset:0;background:rgba(18,40,64,.38);animation:fade .2s}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(88vw,380px);background:#f6faff;border-radius:26px 0 0 26px;padding:16px 16px 24px;overflow:auto;animation:slide .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer-head strong{font-size:1.1rem;color:var(--ink)}
.close-x{width:40px;height:40px;border-radius:12px;border:0;background:#fff;box-shadow:0 0 0 2px var(--line) inset;font-size:1.2rem;cursor:pointer}
.menu-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu-stats .tile{background:#fff}
.menu-stats .tile .v{font-size:1.25rem}
.menu-title{font-weight:800;color:var(--ink);margin:18px 0 8px;font-size:.95rem}
.menu-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-mode{border:0;border-radius:16px;padding:12px;font-weight:800;font-size:1.05rem;background:#fff;box-shadow:0 4px 0 #d6e3ef;cursor:pointer}
.menu-mode[data-menu-mode="learn"].active{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dark)}
.menu-mode[data-menu-mode="quiz"].active{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-dark)}
.menu-chips{display:flex;flex-wrap:wrap;gap:8px}
.menu-links{display:grid;gap:10px;margin-top:22px}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}

/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(18,40,64,.45);padding:16px;animation:fade .2s}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:30px;padding:28px 22px 22px;width:min(100%,420px);text-align:center;box-shadow:0 8px 0 #d6e5f2;animation:pop .35s cubic-bezier(.2,1.4,.5,1)}
.modal-emoji{font-size:3.4rem;line-height:1.1}
.modal-card h2{margin:8px 0 4px;font-size:1.6rem;color:var(--ink);line-height:1.35}
.modal-card p{margin:0 0 6px;color:var(--muted)}
.stars{font-size:2.5rem;letter-spacing:.15em;margin:6px 0}
.stars .off{filter:grayscale(1);opacity:.25}
.modal-btns{display:grid;gap:10px;margin-top:16px}
@keyframes pop{from{transform:scale(.7);opacity:0}}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti i{position:absolute;top:-20px;width:10px;height:15px;border-radius:3px;animation:fall 1.3s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg);opacity:.2}}

.mode-panel{display:none}
.mode-panel.active{display:block}

/* ---------- スマートフォン ---------- */
@media (max-width:800px){
  html,body{height:100%;overflow:hidden}
  body{height:100dvh;display:flex;flex-direction:column;background-attachment:scroll}
  .topbar{flex:none}
  .topbar-inner{padding:6px 8px 6px 10px;gap:8px;min-height:56px}
  .brand,.stats{display:none}
  .mode-pill{display:inline-flex}
  .menu-btn{display:grid;margin-left:0}
  .sound-btn{margin-left:auto}
  .app{flex:1;min-height:0;width:100%;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .mode-tabs,.controls,.info-top,.fact,.info-foot,.map-tip,.q-hint{display:none}
  .mode-panel.active{flex:1;min-height:0;display:flex;flex-direction:column}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  .card{border-radius:20px;box-shadow:0 4px 0 #d6e5f2,0 10px 22px rgba(31,90,150,.07)}
  .map-card{flex:1;min-height:150px;padding:6px}
  .map-wrap{height:auto;min-height:0;border-radius:15px}
  /* 地図の上下の余白をトリム（枠を地図の縦横比に合わせ、県名・問題とボタンは地図のすぐ下に） */
  #learn .map-card,#quiz .map-card{flex:0 1 auto}
  #learn .map-wrap,#quiz .map-wrap{aspect-ratio:1/1}
  .info{padding:12px;gap:10px;flex:none}
  .pref-hero{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;padding:0}
  .num-badge{width:50px;height:50px;font-size:1.25rem}
  .pref-name{font-size:2rem;margin:0;letter-spacing:.03em}
  .pref-ruby{font-size:1rem;letter-spacing:.08em;line-height:1.3}
  .speak{margin:0;padding:10px 12px}
  .speak .lbl{display:none}
  .progress .dot{width:10px;height:10px}
  .bar{height:8px}
  .nav .btn{padding:13px 8px;font-size:1.15rem}
  .qcard{padding:10px 12px 12px;gap:8px;flex:none}
  .q-title h2{font-size:1.25rem}
  .q-head{order:-1}
  .answers{gap:8px}
  .answer{min-height:60px;font-size:1.15rem;padding:8px 6px 6px}
  .answer .key{width:19px;height:19px;font-size:.7rem;left:7px;top:6px}
  .feedback-row{min-height:48px}
  .feedback{font-size:1rem}
  .feedback small{font-size:.78rem}
  #nextQuestion{padding:11px 14px;font-size:1rem}
  .stamp{font-size:1.9rem}
  .records{position:fixed;inset:0;z-index:70;margin:0;border-radius:0;overflow:auto;display:none;padding:16px 14px 30px}
  .records.open{display:block}
  .records-close{display:inline-flex}
  .rec-tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:800px) and (max-height:700px){
  .pref-name{font-size:1.7rem}
  .num-badge{width:44px;height:44px;font-size:1.1rem}
  .progress{display:none}
  .answer{min-height:52px}
  .q-title h2{font-size:1.1rem}
}
@media (min-width:801px){.drawer{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

const STORE_KEY="jpMaster";
function loadState(){

    if(!raw.v&&Array.isArray(raw.seen)){s.mastered=codes(raw.seen);s.viewed=codes(raw.seen)}
    if(raw.v){s.viewed=codes(raw.viewed);s.mastered=codes(raw.mastered)}
    for(const k of ["correct","total","streak","best"])if(Number.isFinite(raw[k])&&raw[k]>=0)s[k]=Math.floor(raw[k]);
    if(s.correct>s.total)s.correct=s.total;

let audioCtx=null;
function ac(){
  if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{audioCtx=new C()}catch(e){return null}}
  if(audioCtx.state==="suspended")audioCtx.resume();

/* f: 周波数（Hz）, t: 開始までの秒, d: 長さ（秒）, to: 最後の周波数（音程をすべらせる） */
function tone(f,t=0,d=.12,{type="sine",vol=.18,to=null}={}){
  const c=ac();if(!c)return;
  const s=c.currentTime+t,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,s);if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.02);
}

      const shapes=[];

        const subs=sh.tagName==="path"?(sh.getAttribute("d")||"").split(/(?=M)/).filter(x=>x.trim()):[];

function setViewBox(svg,b){svg.setAttribute("viewBox",`${b.x.toFixed(1)} ${b.y.toFixed(1)} ${b.w.toFixed(1)} ${b.h.toFixed(1)}`);svg._vb=b;updateLabels(svg)}
/* 覚えるモードの地図の県名：拡大しても文字の大きさは同じ。重なるときは大きい県・えらんでいる地方を優先して表示 */

const prefEl=(host,code)=>host.querySelector(`.prefecture[data-code="${code}"]`);

/* ===== 地図の拡大・縮小（ボタン・ホイール・ドラッグ・ピンチ） ===== */
const ZOOM_MIN=45; /* 表示のはば（地図の座標）の下限＝いちばん大きく拡大したとき */
function clampPan(v){ /* 地図が表示のはしから外へ逃げないようにする（全体より広いときは真ん中に） */
  const F=FULL_BOX,fit=(p,s,a,l)=>s>=l?a+l/2-s/2:Math.min(Math.max(p,a),a+l-s);
  return{x:fit(v.x,v.w,F.x,F.w),y:fit(v.y,v.h,F.y,F.h),w:v.w,h:v.h};
}
function zoomView(v,k,ux,uy){ /* (ux,uy) を中心に k 倍の範囲を表示（k<1 で拡大） */
  k=Math.min(k,Math.max(1,FULL_BOX.w*1.15/v.w,FULL_BOX.h*1.15/v.h));
  k=Math.max(k,Math.min(1,ZOOM_MIN/Math.min(v.w,v.h)));
  return clampPan({x:ux-(ux-v.x)*k,y:uy-(uy-v.y)*k,w:v.w*k,h:v.h*k});
}
function refreshRing(svg,view){const p=svg._paint;if(p)placeRing(svg,p.code,view||svg._vb,p.how)}

function zoomMap(id,dir){
  const svg=$(id)?.querySelector("svg");if(!svg||!svg._vb)return;
  let to;
  if(dir==="reset"){svg._userZoom=false;to=viewFor(svg._paint?.code)}
  else{
    const v=svg._vb,b=BOX&&svg._paint?.code?BOX[svg._paint.code].main:null;
    const z=zoomView(v,dir==="in"?1/1.6:1.6,v.x+v.w/2,v.y+v.h/2); /* 大きさだけ決めて、中心は選んでいる県に */
    to=b?clampPan({x:b.x+b.w/2-z.w/2,y:b.y+b.h/2-z.h/2,w:z.w,h:z.h}):z;svg._userZoom=true;
  }
  sfx(dir==="in"?"zoomIn":dir==="out"?"zoomOut":"reset");
  animateViewBox(svg,to);refreshRing(svg,to);
}
function enableMapZoom(host,svg){
  const pts=new Map();let moved=false,start=null;
  const snap=()=>{const a=[...pts.values()];if(!a.length)return null;
    if(a.length===1)return{x:a[0].x,y:a[0].y,d:0};
    return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};

  const gesture=(p,n)=>{
    const v=svg._vb,m=svg.getScreenCTM();if(!v||!m||!m.a)return;
    const ax=(p.x-m.e)/m.a,ay=(p.y-m.f)/m.d,ox=m.a*v.x+m.e,oy=m.d*v.y+m.f;
    const z=zoomView(v,p.d&&n.d?p.d/n.d:1,ax,ay),upp=z.w/v.w/m.a;

    .map(([k,t,l])=>`<button class="zoom-btn" type="button" data-sfx="own" data-zoom="${k}" aria-label="${l}" title="${l}">${t}</button>`).join("");
  zc.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>zoomMap(host.id,b.dataset.zoom)));
  wrap.appendChild(zc);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRound(){
  const list=currentList();
  const deck=state.order==="number"?list.slice():shuffle(list.slice()).slice(0,Math.min(10,list.length));
  round={deck,i:0,score:0,target:null,answered:false,region:state.region,order:state.order,topic:state.topic};

function nearestChoices(target,list){
  const d=distFrom(target),allCodes=range(1,47);
  const rank=arr=>arr.map(c=>({c,k:(d[c]??99)+Math.random()*.9})).sort((a,b)=>a.k-b.k).map(x=>x.c);
  let out=rank((list.length>=4?list:allCodes).filter(c=>c!==target)).slice(0,3);
  if(out.length<3)out=out.concat(rank(allCodes.filter(c=>c!==target&&!out.includes(c)))).slice(0,3);
  return out;
}
function newQuestion(){
  const list=currentList(),target=round.deck[round.i];

  $("quizBar").style.width=(round.i/round.deck.length*100)+"%";

  box.innerHTML=choices.map((c,i)=>{const p=cap?getCap(c):getPref(c);return`<button class="answer" type="button" data-sfx="own" data-code="${c}"><span class="key">${i+1}</span>${p.name}<span class="ruby">${p.ruby}</span></button>`}).join("");
  box.querySelectorAll(".answer").forEach(b=>b.addEventListener("click",()=>answer(Number(b.dataset.code),b)));
  mapPaint("quizMap",target);

}
const PRAISE=["せいかい！","やったね！","すごい！","さすが！","かんぺき！"];

  state.total++;

  }else{
    state.streak=0;btn.classList.add("wrong");
    fb.innerHTML=isCap()?`おしい！ せいかいは ${getCap(target).name}<small>${getCap(code).name}は ${getPref(code).name}（うすい赤の県）の県庁所在地だよ。つぎはきっとできる！</small>`:`おしい！ せいかいは ${p.name}<small>${getPref(code).name}は うすい赤の県だよ。つぎはきっとできる！</small>`;fb.className="feedback bad";
    stamp.textContent="おしい！";stamp.className="stamp bad";

  sfx("fanfare");

}

/* ===== 地方・出しかた・モードの切りかえ ===== */
function chipsHTML(attr,active){return REGION_LIST.map(r=>`<button class="chip ${r.key===active?"active":""}" type="button" data-region="${r.slug}" ${attr}="${r.key}" aria-pressed="${r.key===active}">${r.key}</button>`).join("")}
function orderHTML(attr){return[["number","🔢 じゅんばん"],["random","🎲 ランダム"]].map(([k,l])=>`<button class="chip plain ${state.order===k?"active":""}" type="button" ${attr}="${k}" aria-pressed="${state.order===k}">${l}</button>`).join("")}
function renderRegionChips(){
  $("regionChips").innerHTML=chipsHTML("data-r",state.region);
  $("menuRegions").innerHTML=chipsHTML("data-menu-region",state.region);
  $("topicChips").innerHTML=topicHTML("data-topic");
  $("menuTopic").innerHTML=topicHTML("data-menu-topic");
  $("orderChips").innerHTML=orderHTML("data-order");
  $("menuOrder").innerHTML=orderHTML("data-menu-order");
  document.querySelectorAll("[data-r],[data-menu-region]").forEach(b=>b.addEventListener("click",()=>{setRegion(b.dataset.r||b.dataset.menuRegion);if(b.dataset.menuRegion)closeMenu()}));
  document.querySelectorAll("[data-topic],[data-menu-topic]").forEach(b=>b.addEventListener("click",()=>{setTopic(b.dataset.topic||b.dataset.menuTopic);if(b.dataset.menuTopic)closeMenu()}));
  updateTopicText();
  document.querySelectorAll("[data-order],[data-menu-order]").forEach(b=>b.addEventListener("click",()=>{setOrder(b.dataset.order||b.dataset.menuOrder);if(b.dataset.menuOrder)closeMenu()}));
  updateModePill();
}
function setRegion(key){state.region=regionByKey(key).key;learnIndex=0;save();renderRegionChips();if(mode==="learn")renderLearn();else startRound()}
function topicHTML(attr){return[["pref","🗾 都道府県"],["capital","🏯 県庁所在地"]].map(([k,l])=>`<button class="chip plain ${state.topic===k?"active":""}" type="button" ${attr}="${k}" aria-pressed="${state.topic===k}">${l}</button>`).join("")}
function setTopic(t){state.topic=t==="capital"?"capital":"pref";save();renderRegionChips();if(mode==="learn")renderLearn();else startRound()}
function updateTopicText(){
  const cap=isCap();
  $("learnTabSub").textContent=cap?"県庁所在地を じゅんばんに":"地図をみながら じゅんばんに";
  $("quizTabSub").textContent=cap?"黄色い県の 県庁所在地は？":"黄色い県はどこ？ 4たくクイズ";
}
function setOrder(o){state.order=o==="random"?"random":"number";save();renderRegionChips();if(mode==="quiz")startRound()}
function setMode(m){
  mode=m==="quiz"?"quiz":"learn";
  document.body.classList.toggle("mode-quiz",mode==="quiz");document.body.classList.toggle("mode-learn",mode==="learn");
  document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.mode===mode;t.classList.toggle("active",on);t.setAttribute("aria-pressed",on)});
  document.querySelectorAll(".menu-mode").forEach(t=>t.classList.toggle("active",t.dataset.menuMode===mode));
  document.querySelectorAll(".mode-panel").forEach(p=>p.classList.toggle("active",p.id===mode));
  if(mode==="quiz"){if(!round.deck.length||round.region!==state.region||round.order!==state.order||round.topic!==state.topic||round.i>=round.deck.length)startRound();else mapPaint("quizMap",round.target,round.answered?"correct":"target")}
  else renderLearn();
  updateModePill();
}
function updateModePill(){
  const r=currentRegion();$("modePill").dataset.region=r.slug;
  $("modePillText").textContent=(mode==="quiz"?"🎤 答える":"📚 覚える")+(isCap()?"（県庁）":"")+"・"+r.key;
}

/* ===== 学習状況・きろく ===== */
function updateStats(){
  const n=learnedSet().size,acc=accuracyText();
  $("learnedCount").textContent=n;$("accuracy").textContent=acc;$("streak").textContent=state.streak;
  $("menuLearnedCount").textContent=n;$("menuAccuracy").textContent=acc;$("menuStreak").textContent=state.streak;
  const sk=$("quizStreak");sk.textContent=`🔥 ${state.streak}連続`;sk.classList.toggle("zero",state.streak===0);
  renderRecords();
}
function renderRecords(){
  const viewed=new Set(topicRec().viewed),mastered=new Set(topicRec().mastered);
  $("recordsTitle").textContent=isCap()?"📊 きろく（県庁所在地）":"📊 きろく（都道府県）";
  $("recordTiles").innerHTML=[["⭐ "+learnedSet().size,"学習した"+(isCap()?"県庁所在地":"県")+" /47"],["🏆 "+mastered.size,"クイズで正解 /47"],["🎯 "+accuracyText(),`正解率（${state.correct}/${state.total}問）`],["🔥 "+state.best,"さいこう連続"]].map(([v,l])=>`<div class="tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  $("recordSummary").innerHTML=REGIONS.map(r=>{
    const m=r.codes.filter(c=>mastered.has(c)).length;
    return`<div class="rgroup" data-region="${r.slug}"><h3>${r.key}<span class="cnt">${m}/${r.codes.length}</span>${m===r.codes.length?'<span class="medal">🏅 せいは！</span>':""}</h3><div class="pchips">${r.codes.map(c=>{const cls=mastered.has(c)?"mastered":viewed.has(c)?"viewed":"";return`<button class="pchip ${cls}" type="button" data-jump="${c}" title="${getPref(c).ruby}">${pad(c)} ${getPref(c).name}</button>`}).join("")}</div></div>`}).join("");
  $("recordSummary").querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{closeRecords();setMode("learn");jumpTo(Number(b.dataset.jump));window.scrollTo({top:0,behavior:"smooth"})}));
}
function clearData(){
  showModal({emoji:"🗑️",title:"きろくを ぜんぶ消す？",text:"学習した県や正解率が 0 にもどるよ",buttons:[
    {label:"やめる",cls:"btn-ghost",fn:()=>{}},
    {label:"消す",cls:"btn-danger",fn:()=>{Object.assign(state,{viewed:[],mastered:[],cap:{viewed:[],mastered:[]},correct:0,total:0,streak:0,best:0});save();learnIndex=0;renderLearn()}}]});
}

/* ===== メニュー・モーダル・演出 ===== */
function openMenu(){const m=$("mobileMenu");m.classList.add("open");m.setAttribute("aria-hidden","false");$("mobileMenuButton").setAttribute("aria-expanded","true");m.querySelector(".close-x").focus()}
function closeMenu(){const m=$("mobileMenu");if(!m.classList.contains("open"))return;m.classList.remove("open");m.setAttribute("aria-hidden","true");$("mobileMenuButton").setAttribute("aria-expanded","false")}
function openRecords(){closeMenu();$("records").classList.add("open");$("recordsClose").focus()}
function closeRecords(){$("records").classList.remove("open")}
let modalReturn=null;
function showModal({emoji,title,text,stars,buttons}){
  modalReturn=document.activeElement;
  const card=$("modalCard");
  card.innerHTML=`<div class="modal-emoji" aria-hidden="true">${emoji}</div><h2 id="modalTitle">${title}</h2>${stars?`<div class="stars" aria-label="ほし${stars}こ">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}">⭐</span>`).join("")}</div>`:""}<p>${text||""}</p><div class="modal-btns"></div>`;
  const wrap=card.querySelector(".modal-btns");
  buttons.forEach(b=>{const el=document.createElement("button");el.type="button";el.className="btn "+b.cls;el.textContent=b.label;
    if(b.cls.includes("quizcolor"))el.style.cssText="background:var(--orange);box-shadow:0 5px 0 var(--orange-dark)";
    el.addEventListener("click",()=>{closeModal();b.fn()});wrap.appendChild(el)});
  $("modal").hidden=false;wrap.firstChild.focus();
}
function closeModal(){$("modal").hidden=true;if(modalReturn&&modalReturn.focus)try{modalReturn.focus({preventScroll:true})}catch(e){}}
function confetti(n=45){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=$("confetti"),colors=["#ff6b6b","#ffd43b","#51cf66","#339af0","#845ef7","#ff922b","#f06595"];box.innerHTML="";
  for(let i=0;i<n;i++){const x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.background=colors[i%colors.length];x.style.animationDelay=Math.random()*.4+"s";x.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(x)}
  clearTimeout(confetti.t);confetti.t=setTimeout(()=>box.innerHTML="",1900);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("modal").hidden)closeModal();closeMenu();closeRecords();return}

  const onBtn=document.activeElement&&/^(BUTTON)$/.test(document.activeElement.tagName);
  const zk={"+":"in",";":"in","=":"in","-":"out","0":"reset"}[e.key];
  if(zk){zoomMap(mode==="learn"?"japanMap":"quizMap",zk);return}
  if(mode==="learn"){if(e.key==="ArrowRight")learnNext();else if(e.key==="ArrowLeft")learnPrev()}
  else{
    if(/^[1-4]$/.test(e.key)&&!round.answered){const b=$("answers").children[Number(e.key)-1];if(b)b.click()}
    else if(e.key==="Enter"&&round.answered&&!onBtn)nextQuestion();
  }
});
